services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile.crm
      args:
        VITE_API_URL: ${{project.VITE_API_URL}}
        PORT: "80"
        BASE_PATH: "/"
    restart: unless-stopped
    environment:
      # API_PROXY_URL is used by nginx at container startup to set the /api proxy target.
      # Must be set in Dokploy project-level environment variables.
      API_PROXY_URL: ${{project.API_PROXY_URL}}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
